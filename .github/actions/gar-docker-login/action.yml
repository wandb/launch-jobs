name: GAR Docker Login
description: Authenticate to GCP with Workload Identity Federation and configure Docker for GAR.

inputs:
  workload_identity_provider:
    description: GCP Workload Identity Provider resource name.
    required: true
  service_account:
    description: Service account email to impersonate.
    required: true
  project_id:
    description: GCP project ID.
    required: false
    default: wandb-production
  registry:
    description: Artifact Registry host to configure for Docker.
    required: false
    default: us-docker.pkg.dev

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        create_credentials_file: true
        export_environment_variables: true

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Authorize Docker to use Google Artifact Registry
      shell: bash
      run: gcloud auth configure-docker "${{ inputs.registry }}" --quiet
