name: Publish changed images

on:
  push:
    branches: [main]
    paths:
      - "jobs/**"
      - "services/**"
      - ".github/image-builds.json"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name from .github/image-builds.json, or 'all'"
        required: true
        default: all

permissions:
  contents: read

jobs:
  select-images:
    if: github.event_name == 'workflow_dispatch' || vars.IMAGE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select affected images
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCED_IMAGE: ${{ inputs.image }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix="$(.github/scripts/select-images.py --image "$FORCED_IMAGE")"
          else
            matrix="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | .github/scripts/select-images.py)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: select-images
    if: needs.select-images.outputs.count != '0'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.matrix) }}
    concurrency:
      group: publish-image-${{ matrix.image }}
      cancel-in-progress: true
    env:
      GAR_REPOSITORY: us-docker.pkg.dev/wandb-production/public/wandb
      DOCKERHUB_REPOSITORY: docker.io/wandb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gar-docker-login
        with:
          workload_identity_provider: ${{ secrets.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CI_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: refs
        name: Generate image references
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          {
            echo "gar_image=$GAR_REPOSITORY/$IMAGE"
            echo "gar_sha=$GAR_REPOSITORY/$IMAGE:$GITHUB_SHA"
            echo "gar_branch=$GAR_REPOSITORY/$IMAGE:$branch"
            echo "dockerhub_image=$DOCKERHUB_REPOSITORY/$IMAGE"
            echo "dockerhub_sha=$DOCKERHUB_REPOSITORY/$IMAGE:$GITHUB_SHA"
            echo "dockerhub_branch=$DOCKERHUB_REPOSITORY/$IMAGE:$branch"
          } >> "$GITHUB_OUTPUT"

      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.refs.outputs.gar_image }}
          tags: type=raw,value=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          annotations: org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - id: existing
        name: Check for canonical GAR image
        env:
          GAR_SHA: ${{ steps.refs.outputs.gar_sha }}
        run: |
          if docker buildx imagetools inspect "$GAR_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        name: Build canonical GAR image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.gar_sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - id: canonical
        name: Validate canonical GAR image
        env:
          GAR_SHA: ${{ steps.refs.outputs.gar_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$GAR_SHA" | awk '$1 == "Digest:" { print $2; exit }')"
          test -n "$digest"
          manifest="$(docker buildx imagetools inspect --raw "$GAR_SHA")"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"]
            | contains(["linux/amd64", "linux/arm64"])
          ' <<< "$manifest"
          jq -e --arg revision "$SOURCE_SHA" '
            [
              ((.annotations // {})["org.opencontainers.image.revision"] // empty),
              (.manifests[]? | ((.annotations // {})["org.opencontainers.image.revision"] // empty))
            ]
            | index($revision) != null
          ' <<< "$manifest"
          if [[ "${{ steps.existing.outputs.exists }}" != "true" ]]; then
            test "$digest" = "${{ steps.build.outputs.digest }}"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Canonical image: $GAR_SHA@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror canonical image to Docker Hub
        env:
          GAR_IMAGE: ${{ steps.refs.outputs.gar_image }}
          GAR_DIGEST: ${{ steps.canonical.outputs.digest }}
          DOCKERHUB_SHA: ${{ steps.refs.outputs.dockerhub_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_SHA" \
            "$GAR_IMAGE@$GAR_DIGEST"

      - id: mirror
        name: Validate Docker Hub mirror
        env:
          GAR_SHA: ${{ steps.refs.outputs.gar_sha }}
          DOCKERHUB_SHA: ${{ steps.refs.outputs.dockerhub_sha }}
        run: |
          gar_manifest="$(docker buildx imagetools inspect --raw "$GAR_SHA")"
          dockerhub_manifest="$(docker buildx imagetools inspect --raw "$DOCKERHUB_SHA")"
          gar_platforms="$(jq -c '[.manifests[] | {digest, platform}] | sort_by(.platform.os, .platform.architecture, .platform.variant, .digest)' <<< "$gar_manifest")"
          dockerhub_platforms="$(jq -c '[.manifests[] | {digest, platform}] | sort_by(.platform.os, .platform.architecture, .platform.variant, .digest)' <<< "$dockerhub_manifest")"
          test "$dockerhub_platforms" = "$gar_platforms"
          digest="$(docker buildx imagetools inspect "$DOCKERHUB_SHA" | awk '$1 == "Digest:" { print $2; exit }')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Docker Hub mirror: $DOCKERHUB_SHA@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote current commit to branch tags
        env:
          GAR_IMAGE: ${{ steps.refs.outputs.gar_image }}
          GAR_BRANCH: ${{ steps.refs.outputs.gar_branch }}
          GAR_DIGEST: ${{ steps.canonical.outputs.digest }}
          DOCKERHUB_IMAGE: ${{ steps.refs.outputs.dockerhub_image }}
          DOCKERHUB_BRANCH: ${{ steps.refs.outputs.dockerhub_branch }}
          DOCKERHUB_DIGEST: ${{ steps.mirror.outputs.digest }}
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{ print $1 }')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping branch tags: $GITHUB_REF_NAME has advanced to $remote_sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker buildx imagetools create --tag "$GAR_BRANCH" "$GAR_IMAGE@$GAR_DIGEST"
          docker buildx imagetools create --tag "$DOCKERHUB_BRANCH" "$DOCKERHUB_IMAGE@$DOCKERHUB_DIGEST"

          gar_branch_manifest="$(docker buildx imagetools inspect --raw "$GAR_BRANCH")"
          gar_sha_manifest="$(docker buildx imagetools inspect --raw "${{ steps.refs.outputs.gar_sha }}")"
          dockerhub_branch_manifest="$(docker buildx imagetools inspect --raw "$DOCKERHUB_BRANCH")"
          dockerhub_sha_manifest="$(docker buildx imagetools inspect --raw "${{ steps.refs.outputs.dockerhub_sha }}")"
          normalize='[.manifests[] | {digest, platform}] | sort_by(.platform.os, .platform.architecture, .platform.variant, .digest)'
          test "$(jq -c "$normalize" <<< "$gar_branch_manifest")" = "$(jq -c "$normalize" <<< "$gar_sha_manifest")"
          test "$(jq -c "$normalize" <<< "$dockerhub_branch_manifest")" = "$(jq -c "$normalize" <<< "$dockerhub_sha_manifest")"
          echo "Promoted $GAR_BRANCH and $DOCKERHUB_BRANCH." >> "$GITHUB_STEP_SUMMARY"
